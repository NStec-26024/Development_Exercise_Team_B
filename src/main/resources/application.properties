spring.application.name=demo

# PostgreSQL 接続設定
spring.datasource.url=jdbc:postgresql://localhost:5432/development?connectTimeout=5
spring.datasource.username=postgres
spring.datasource.password=postgres

# HikariCP
spring.datasource.hikari.connection-timeout=3000

# JPA（Hibernate）設定
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# MyBatis 設定
mybatis.mapper-locations=classpath:com/example/fullness/stationary/repository/*.xml
mybatis.type-aliases-package=com.example.fullness.stationary.entity
mybatis.configuration.map-underscore-to-camel-case=true

spring.sql.init.enabled=false

server.servlet.session.timeout=30m
spring.mvc.throw-exception-if-no-handler-found=true

test.sql.clear=classpath:sql/clear.sql
test.sql.data=classpath:sql/data.sql

# ==========================================================================
# 定数の一括管理定義
# ==========================================================================
login.max-attempts=5
login.lock-minutes=10

product.max-price=1000000
product.max-stock=1000
product.allowed-image-extensions=jpg,jpeg,png

session.key.admin-product=adminProductSessionData
