<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>商品カテゴリ登録(確認) - フルネス文具 管理画面</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>
    <div th:replace="~{admin/fragments/layout :: header}"></div>

    <main class="container">
        <div class="admin-panel p-4 mx-auto text-center" style="max-width: 480px;">
            <h1 class="mb-4">商品カテゴリ登録(確認)</h1>
            <p>カテゴリ名　<strong th:text="${categoryName}"></strong></p>

            <form th:action="@{/admin/category/add/postcomplete}" method="post" th:object="${adminProductCategoryForm}">
                <input type="hidden" th:field="*{name}">
                <button type="submit" name="action" th:formaction="@{/admin/category/add/back}"
                    class="btn btn-fs px-4">戻る</button>
                <button type="submit" name="action" class="btn btn-fs-solid px-4">登録</button>
            </form>
        </div>
    </main>

    <div th:replace="~{admin/fragments/layout :: footer}"></div>
</body>

</html>
