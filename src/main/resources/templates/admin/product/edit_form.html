<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>商品修正(入力) - フルネス文具 管理画面</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>
    <div th:replace="~{admin/fragments/layout :: header}"></div>

    <main class="container">
        <div class="admin-panel p-4 mx-auto" style="max-width: 560px;">
            <h1 class="text-center mb-4">商品修正(入力)</h1>

            <ul class="alert alert-danger" th:if="${errorMessages}">
                <li th:each="msg : ${errorMessages}" th:text="${msg}"></li>
            </ul>

            <form th:object="${form}" th:action="@{/admin/product/edit/{id}(id=${form.id})}" method="post"
                enctype="multipart/form-data">

                <div class="mb-3 row">
                    <label class="col-sm-4 col-form-label">商品名</label>
                    <div class="col-sm-8">
                        <input type="text" th:field="*{name}" class="form-control" maxlength="20">

                        <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>
                </div>

                <div class="mb-3 row">
                    <label class="col-sm-4 col-form-label">単価</label>
                    <div class="col-sm-8">
                        <input type="text" th:field="*{price}" class="form-control">

                        <div class="text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                    </div>
                </div>

                <div class="mb-3 row">
                    <label class="col-sm-4 col-form-label">在庫数</label>
                    <div class="col-sm-8">
                        <input type="text" th:field="*{stock}" class="form-control">

                        <div class="text-danger" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></div>
                    </div>
                </div>

                <div class="mb-3 row">
                    <label class="col-sm-4 col-form-label">商品カテゴリ</label>
                    <div class="col-sm-8">
                        <select th:field="*{categoryId}" class="form-select">
                            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">
                            </option>
                        </select>

                        <div class="text-danger" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}">
                        </div>
                    </div>
                </div>

                <div class="mb-3 row">
                    <label class="col-sm-4 col-form-label">画像</label>
                    <div class="col-sm-8">
                        <input type="file" th:field="*{image}" class="form-control">

                        <div class="text-danger" th:if="${#fields.hasErrors('image')}" th:errors="*{image}"></div>
                    </div>
                </div>

                <!-- 画像表示はそのまま -->
                <div class="text-center mb-3" th:if="${form.imagePath}">
                    <img th:src="@{/images/{image}(image=${form.imagePath})}" th:alt="${form.name}" class="img-fluid"
                        style="max-height: 160px;">
                </div>

                <div class="text-center mt-4">
                    <a th:href="@{/admin/product}" class="btn btn-link link-fs">キャンセル</a>
                    <button type="submit" class="btn btn-fs-solid px-4">完了</button>
                </div>

            </form>

        </div>
    </main>

    <div th:replace="~{admin/fragments/layout :: footer}"></div>
</body>

</html>
