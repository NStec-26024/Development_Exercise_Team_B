<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>新商品登録(確認) - フルネス文具 管理画面</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>
    <div th:replace="~{admin/fragments/layout :: header}"></div>

    <main class="container">
        <div class="admin-panel p-4 mx-auto text-center" style="max-width: 480px;">
            <h1 class="mb-4">新商品登録(確認)</h1>

            <table class="table text-start">
                <tbody>
                    <tr>
                        <th class="w-25">商品名</th>
                        <td th:text="${form.name}"></td>
                    </tr>
                    <tr>
                        <th>単価</th>
                        <td th:text="${form.price} + '円'"></td>
                    </tr>
                    <tr>
                        <th>在庫数</th>
                        <td th:text="${form.stock}"></td>
                    </tr>
                    <tr>
                        <th>商品カテゴリ</th>
                        <td th:text="${form.categoryName}"></td>
                    </tr>
                    <tr>
                        <th>画像</th>
                        <td>
                            <div th:if="${imageUrl != null}">
                                <img th:src="${imageUrl}" th:alt="${form.name}" class="img-fluid"
                                    style="max-height: 160px; object-fit: contain;">
                            </div>
                            <div th:unless="${imageUrl != null}">
                                <span class="text-muted small">画像なし</span>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
            <!-- <img th:src="@{${form.imagePath}}" th:alt="${form.name}" class="img-fluid mb-4" style="max-height: 160px;"> -->
            <!-- <img th:src="${imageUrl}" th:alt="${form.name}" class="img-fluid mb-4" style="max-height: 160px;"> -->


            <form th:action="@{/admin/product/add/postcomplete}" method="post">
                <input type="hidden" name="name" th:value="${form.name}">
                <input type="hidden" name="price" th:value="${form.price}">
                <input type="hidden" name="stock" th:value="${form.stock}">
                <input type="hidden" name="categoryId" th:value="${form.categoryId}">

                <a th:href="@{/admin/product}" class="btn btn-link link-fs">キャンセル</a>
                <button type="submit" name="action" value="back" class="btn btn-fs px-4">戻る</button>
                <button type="submit" name="action" value="complete" class="btn btn-fs-solid px-4">完了</button>
            </form>
        </div>
    </main>

    <div th:replace="~{admin/fragments/layout :: footer}"></div>
</body>

</html>
