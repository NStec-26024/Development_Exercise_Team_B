<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>ログイン</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <!-- 上部ヘッダー（site-header に統合） -->
    <div th:replace="~{admin/common/header :: header}"></div>

    <!-- メイン -->
    <main class="main-content">
        <h2>ログイン画面</h2>

        <form th:action="@{/admin/login}" th:object="${adminLoginForm}" method="post">

            <!-- エラーメッセージ -->
            <div th:if="${timeoutMessage != null or securityErrorMessage != null or errorMessage != null or #fields.hasErrors()}"
                class="error-message" style="margin-bottom: 20px; font-weight: bold; font-size: 16px;">

                <div th:if="${errorMessage != null}">
                    <p th:text="${errorMessage}"></p>
                </div>

                <div th:if="${timeoutMessage != null}">
                    <p th:text="${timeoutMessage}"></p>
                </div>

                <div th:if="${securityErrorMessage != null}">
                    <p th:text="${securityErrorMessage}"></p>
                </div>

                <div th:if="${#fields.hasErrors()}">
                    <p th:each="err : ${#fields.errors('name')}" th:text="${err}"></p>
                    <p th:each="err : ${#fields.errors('password')}" th:text="${err}"></p>
                </div>
            </div>

            <!-- ユーザー名 -->
            <div>
                <label for="username">ユーザー名：</label>
                <input type="text" id="username" th:field="*{name}" th:errorclass="is-error" />
            </div>

            <!-- パスワード -->
            <div>
                <label for="password">パスワード：</label>
                <input type="password" id="password" th:field="*{password}" th:errorclass="is-error" />
            </div>

            <!-- 送信ボタン -->
            <div>
                <button type="submit" class="logout-btn">ログイン</button>
            </div>

        </form>
    </main>

    <div th:replace="~{admin/common/footer :: footer}"></div>

</body>

</html>
