<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>ログイン - フルネス文具 管理画面</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <style>
        .error-message {
            min-height: 10px;
            color:
                #d32f2f;

        }
    </style>
</head>

<body>
    <div th:replace="~{admin/fragments/layout :: header}"></div>

    <main class="container">
        <div class="admin-panel p-4 mx-auto" style="max-width: 480px;">
            <h1 class="text-center mb-4">ログイン</h1>

            <form th:action="@{/admin/login}" method="post" th:object="${adminLoginForm}">

                <div
                    th:if="${timeoutMessage != null or securityErrorMessage != null or errorMessage != null or #fields.hasErrors()}">
                    <div th:if="${errorMessage != null}">
                        <p th:text="${errorMessage}" class="error-message"></p>
                    </div>

                    <div th:if="${timeoutMessage != null}">
                        <p th:text="${timeoutMessage}" class="error-message"></p>
                    </div>
                    <div th:if="${securityErrorMessage != null}">
                        <p th:text="${securityErrorMessage}" class="error-message"></p>
                    </div>
                    <div th:if="${#fields.hasErrors()}">
                        <p th:each="err : ${#fields.errors('name')}" th:text="${err}"></p>
                        <p th:each="err : ${#fields.errors('password')}" th:text="${err}" class="error-message"></p>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="username">アカウント名</label>
                    <input type="text" id="username" class="form-control" th:field="*{name}" maxlength="20">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">パスワード</label>
                    <input type="password" id="password" th:field="*{password}" class="form-control" maxlength="20">
                </div>
                <div class="text-center">
                    <button type="submit" class="btn btn-fs-solid px-4">ログイン</button>
                </div>
            </form>
        </div>
    </main>

    <div th:replace="~{admin/fragments/layout :: footer}"></div>
</body>

</html>
