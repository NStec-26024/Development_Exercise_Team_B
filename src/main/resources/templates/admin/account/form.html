<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>アカウント登録(入力) - フルネス文具 管理画面</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <style>
        .error-message {
            min-height: 10px;
            color:
                #d32f2f;
            font-size: 10px;
            margin-top: 1px;
        }
    </style>
</head>

<body>
    <div th:replace="~{admin/fragments/layout :: header}"></div>

    <main class="container">
        <div class="admin-panel p-4 mx-auto" style="max-width: 560px;">
            <h1 class="text-center mb-4">アカウント登録(入力)</h1>

            <ul class="alert alert-danger" th:if="${!#strings.isEmpty(errorMessages)}">
                <li th:each="msg : ${errorMessages}" th:text="${msg}"></li>
            </ul>

            <form th:action="@{/admin/account/postconfirm}" method="post" th:object="${accountRegistForm}">
                <div class="mb-3 row">
                    <label class="col-sm-4 col-form-label">社員名</label>
                    <div class="col-sm-8">
                        <select id="selectEmpName" th:field="*{employeeId}" class="form-select">
                            <option value="">選択してください</option>
                            <option th:each="employee : ${employeeName}" th:value="${employee.employee.id}"
                                th:name="employeeId" th:text="${employee.employee.name}"></option>
                        </select>
                    </div>
                </div>
                <div th:classappend="${#fields.hasErrors('employeeId')} ? 'has-error'">
                    <span th:if="${#fields.hasErrors('employeeId')}" th:errors="*{employeeId}" class="error-message"
                        role="alert"></span>
                </div>

                <div class="mb-3 row">
                    <label for="accountNameLabel" class="col-sm-4 col-form-label">アカウント名</label>
                    <div class="col-sm-8">
                        <input type="text" th:field="*{name}" class="form-control" maxlength="20">
                    </div>
                </div>
                <div th:classappend="${#fields.hasErrors('name')} ? 'has-error'">
                    <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="error-message"
                        role="alert"></span>
                </div>

                <div class="mb-3 row">
                    <label class="col-sm-4 col-form-label">パスワード</label>
                    <div for="passwordLabel" class="col-sm-8">
                        <input type="password" th:field="*{password}" class="form-control" maxlength="20">
                    </div>
                </div>
                <div th:classappend="${#fields.hasErrors('password')} ? 'has-error'">
                    <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error-message"
                        role="alert"></span>
                </div>

                <div class="text-center mt-4">
                    <a th:href="@{/admin}" class="btn btn-link link-fs">キャンセル</a>
                    <button type="submit" class="btn btn-fs-solid px-4">完了</button>
                </div>
            </form>
        </div>
    </main>

    <div th:replace="~{admin/fragments/layout :: footer}"></div>
</body>

</html>
