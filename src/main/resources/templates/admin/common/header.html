<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8">
</head>

<body>

  <header th:fragment="header" class="site-header">
    <h1>フルネス文具 管理画面</h1>
    <nav>
      <!-- 💡 修正ポイント：isAuthenticated() から hasRole('ADMIN') に変更 -->
      <!-- ADMIN ロールを持っている場合のみ、管理メニュー一式を表示します -->
      <span sec:authorize="hasRole('ADMIN')" class="header-logged-in">
        <a th:href="@{/admin/item}">商品情報メンテナンス</a>
        <a th:href="@{/admin/category}">商品カテゴリ登録</a>
        <a th:href="@{/admin/register}">アカウント登録</a>
        <a th:href="@{/logout}" class="logout-btn">ログアウト</a>
      </span>

      <!-- 💡 ADMIN ではない場合（未ログイン、または将来一般USERでログインした場合など）はログインボタンのみ表示 -->
      <span sec:authorize="!hasRole('ADMIN')">
        <a th:href="@{/admin/login}" class="logout-btn login-link-btn">ログイン</a>
      </span>
    </nav>
  </header>

</body>

</html>
