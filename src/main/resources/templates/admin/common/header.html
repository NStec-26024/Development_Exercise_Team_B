<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8">
</head>

<body>
  <header th:fragment="header" class="site-header">
    <h1>フルネス文具 管理画面</h1>
    <nav>
      <span sec:authorize="hasRole('ADMIN')" class="header-logged-in">
        <a th:href="@{/admin/product}">商品情報メンテナンス</a>
        <a th:href="@{/admin/category}">商品カテゴリ登録</a>
        <a th:href="@{/admin/account/form}">アカウント登録</a>
        <form th:action="@{/admin/logout}" method="post" style="display:inline;">
          <button type="submit" class="logout-btn">ログアウト</button>
        </form>
      </span>

      <span sec:authorize="!hasRole('ADMIN')">
        <a th:href="@{/admin/login}" class="logout-btn login-link-btn">ログイン</a>
      </span>
    </nav>
  </header>

</body>

</html>
