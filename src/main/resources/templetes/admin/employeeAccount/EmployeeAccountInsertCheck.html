<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
     <meta charset="UTF-8">
    <title>アカウント登録(確認)</title>

    </head>

<body>
    <div th:replace="~{admin/common/header :: header}"></div>
    <main class="container">
    <h1 class="page-title">
        アカウント登録(確認)
    </h1>
    <table>
        <tr>社員名
        <td>${empName}</td>
        </tr>
        <tr>アカウント名</tr>
        <td>${accountName}</td>
        <tr>パスワード</tr>
        <td><span th:text="${#strings.repeat('*', password.length())}">**********</span></td>
    </table>
    <form th:action="@{/admin/account/complete}" method="post" th:object="${employeeAccount}">
        <div class="form-row">
   
        <label for="empNameLabel">社員名</label>
        <select id="selectEmpName" name="empName">
                    <option th:each="empName : ${empNameList}"
                        th:field="*{empName}" th:text="${category.name}">
                    </option>
        </select>
        <p>社員名</p>
        </div>
        
        <div class="form-row">

                <label for="accountNameLabel">アカウント名</label>
                <input type="text" th:field="*{accountName}">
        </div>
        <div class="form-row">
        
                <label for="passwordLabel">パスワード</label>
                <input type="password" th:field="*{password}">
        </div>
                
      
            <div class="form-actions">
                <a th:href="@{/admin/account/form}" class="link-cancel" >キャンセル</a> 
                
                <button type="submit" name="confirm" method="post" class="btn-primary">完了</button>
                </div>
                

    </form>
    </main>
        <span th:each="error : ${#fields.detailedErrors()}"> 
          <span th:text="${error.message}"></span><br/> 
        </span>
    </div>
     <div th:replace="~{admin/common/footer :: footer}"></div>
</body>
</html>
